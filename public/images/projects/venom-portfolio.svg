<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a10" />
      <stop offset="50%" stop-color="#12121e" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B7CFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38CFFF" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="140" fill="#9B7CFF" opacity="0.25" filter="url(#blurGlow)" />
  <circle cx="600" cy="350" r="160" fill="#38CFFF" opacity="0.2" filter="url(#blurGlow)" />

  <!-- Glass Browser Window -->
  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="20" fill="#11111a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    <rect width="680" height="45" rx="20" fill="rgba(255,255,255,0.04)" />
    
    <!-- Window controls -->
    <circle cx="30" cy="22" r="6" fill="#ff5f56" opacity="0.8" />
    <circle cx="50" cy="22" r="6" fill="#ffbd2e" opacity="0.8" />
    <circle cx="70" cy="22" r="6" fill="#27c93f" opacity="0.8" />

    <!-- Address bar -->
    <rect x="110" y="12" width="460" height="22" rx="11" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" />
    <text x="250" y="27" fill="#A7A7B5" font-family="monospace" font-size="11">https://venom-dev.vercel.app</text>

    <!-- Hero Content Mockup -->
    <text x="50" y="110" fill="#38CFFF" font-family="sans-serif" font-weight="bold" font-size="14" letter-spacing="2">VENOM DEV</text>
    <text x="50" y="150" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="32">Abdeldjalil Medjahdi</text>
    <text x="50" y="180" fill="#9B7CFF" font-family="sans-serif" font-size="16">Web Developer &amp; AI Automation Specialist</text>

    <!-- Glass Button Mockup -->
    <rect x="50" y="210" width="160" height="40" rx="12" fill="url(#glow)" />
    <text x="85" y="235" fill="#050505" font-family="sans-serif" font-weight="bold" font-size="13">Explore Services</text>

    <rect x="225" y="210" width="130" height="40" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
    <text x="255" y="235" fill="#FFFFFF" font-family="sans-serif" font-size="13">Contact</text>

    <!-- Right Side Hero Illustration -->
    <rect x="420" y="80" width="220" height="260" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(155, 124, 255, 0.3)" />
    <circle cx="530" cy="180" r="50" fill="#181825" stroke="#38CFFF" stroke-width="2" />
    <text x="510" y="190" fill="url(#glow)" font-family="sans-serif" font-weight="900" font-size="28">AM</text>
  </g>
</svg>
